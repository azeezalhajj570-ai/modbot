[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modbot"
version = "0.1.0"
description = "Modbot - Telegram group moderation bot"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.15.0",
  "sqlalchemy[asyncio]>=2.0.37",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.7.0",
  "redis>=5.2.1",
  "dramatiq[redis]>=1.17.1",
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "prometheus-client>=0.21.1",
  "sentry-sdk[fastapi]>=2.19.2",
  "structlog>=24.4.0",
  "httpx>=0.28.1",
  "telethon>=1.38.1",
  "cryptography>=42.0.0",
  "stripe>=9.0.0",
]

[project.scripts]
modbot-scraper = "bot.run_scraper_service:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "pytest-mock>=3.14.0",
  "testcontainers[redis,postgres]>=4.8.2",
  "aiosqlite>=0.20.0",
  "ruff>=0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require containerized services",
]

[tool.setuptools.packages.find]
include = ["bot*"]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: modbot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/modbot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m bot.main
    env_file: .env
    environment:
      BOT_APP_KIND: admin
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/modbot
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LANGUAGE: ar
      AIROGRAM_LOG_LEVEL: WARNING
      LOG_RAW_UPDATES: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: dramatiq bot.workers.tasks
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/modbot
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LANGUAGE: ar
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  agent_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: dramatiq bot.agents.worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/modbot
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LANGUAGE: ar
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/modbot
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LANGUAGE: ar
    ports:
      - "8001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  miniapp_modbot:
    build:
      context: .
      dockerfile: docker/miniapp-modbot.Dockerfile
    ports:
      - "5177:80"
    environment:
      VITE_API_URL: http://backend:8001

  miniapp_admin:
    build:
      context: .
      dockerfile: docker/miniapp-admin.Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://backend:8001

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    ports:
      - "5174:80"
    environment:
      VITE_API_URL: http://backend:8001

volumes:
  pg_data:
  redis_data:

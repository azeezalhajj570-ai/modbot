services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file: .env.deploy
    networks:
      - combot_default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m bot.main
    env_file: .env.deploy
    environment:
      BOT_APP_KIND: admin
    networks:
      - combot_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: dramatiq bot.workers.tasks
    env_file: .env.deploy
    networks:
      - combot_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  agent_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: dramatiq bot.agents.worker
    env_file: .env.deploy
    networks:
      - combot_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.deploy
    environment:
      BOT_APP_KIND: admin
    ports:
      - "8001:8080"
    networks:
      - combot_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  combot_default:
    external: true
